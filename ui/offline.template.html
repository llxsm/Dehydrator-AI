<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dehydrator AI · 文字脱水机</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --line:#242a33; --text:#e8eaed; --dim:#8b95a5;
    --w3:#ff5c5c; --w2:#ffa94d; --w1:#8b95a5; --dil:#7aa2f7; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
  header h1{font-size:30px;letter-spacing:-.5px;margin:0 0 6px}
  header h1 span{color:var(--w2)}
  header p{margin:0;color:var(--dim);font-size:14px}
  .badge{display:inline-block;margin-left:10px;padding:2px 8px;border:1px solid var(--line);
    border-radius:99px;font-size:11px;color:var(--dim);vertical-align:middle}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:22px}
  textarea{width:100%;min-height:170px;background:#0b0d10;color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:14px;font:14px/1.75 inherit;resize:vertical;outline:none}
  textarea:focus{border-color:#3a4452}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:#0b0d10;
    color:var(--dim);font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:#3a4452;color:var(--text)}
  .grow{flex:1}
  button.primary{padding:10px 22px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffb454,#ff9f2e);
    color:#1a1205;font-weight:700;font-size:15px;cursor:pointer}
  button.primary:disabled{opacity:.45;cursor:default}
  button.ghost{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:transparent;
    color:var(--dim);font-size:13px;cursor:pointer}
  button.ghost:hover{color:var(--text);border-color:#3a4452}
  select{background:#0b0d10;color:var(--text);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:13px;outline:none}
  .stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:20px;padding:16px 18px;border-radius:12px;
    background:#101317;border:1px solid var(--line)}
  .stat b{display:block;font-size:24px;line-height:1.2;letter-spacing:-.5px}
  .stat s{display:block;text-decoration:none;color:var(--dim);font-size:12px;margin-top:2px}
  h2{font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  h2 em{font-style:normal;color:var(--dim);font-weight:400;font-size:13px}
  .cand{border:1px solid var(--line);border-left:3px solid var(--w2);border-radius:10px;
    padding:12px 14px;margin-bottom:9px;background:#101317}
  .cand.w3{border-left-color:var(--w3)} .cand.w2{border-left-color:var(--w2)} .cand.w1{border-left-color:var(--w1)}
  .cand.dil{border-left-color:var(--dil)}
  .cand .meta{font-size:12px;color:var(--dim);margin-bottom:5px}
  .cand .meta b{color:var(--text);font-weight:600}
  .cand .tag{display:inline-block;padding:1px 7px;border-radius:5px;background:#1d222a;
    color:var(--dim);font-size:11px;margin-right:6px}
  .cand .hit{color:#ffd8a8;background:#2a1f10;padding:0 3px;border-radius:3px}
  .cand .sentence{font-size:14px;color:#c9cfd8}
  .doc{max-height:420px;overflow:auto;background:#0b0d10;border:1px solid var(--line);
    border-radius:10px;padding:16px;font-size:14px;line-height:1.9;white-space:pre-wrap}
  mark{background:#2a1f10;color:#ffd8a8;border-radius:3px;padding:0 2px}
  mark.w3{background:#31181a;color:#ff9d9d}
  .gaps{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .gap{padding:5px 11px;border-radius:8px;font-size:13px;border:1px solid #3a2226;background:#1d1417;color:#ff9d9d}
  .have{padding:5px 11px;border-radius:8px;font-size:13px;border:1px solid #1e3328;background:#101d16;color:var(--ok)}
  .note{color:var(--dim);font-size:12px;margin-top:10px}
  .hidden{display:none}
  footer{margin-top:50px;color:#5c6472;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>文字<span>脱水</span>机 <span class="badge">零依赖 · 断网可用</span></h1>
    <p>把长文本榨成一句真话和一个动作。纯前端运行，不上传你的文本。</p>
  </header>

  <div class="panel">
    <textarea id="input" placeholder="把长文本粘进来：学生手册、用户协议、甲方需求、岗位描述……"></textarea>
    <div class="row">
      <span class="chip" data-preset="0">学生手册·会挂科的那几条</span>
      <span class="chip" data-preset="1">用户协议·视为同意</span>
      <span class="chip" data-preset="2">甲方·先做一版看看</span>
      <span class="grow"></span>
      <label class="chip">载入 .txt<input id="file" type="file" accept=".txt,.md" style="display:none"></label>
      <select id="reg">
        <option value="auto">自动识别语域</option>
        <option value="recruit">招聘 / 招募</option>
        <option value="contract">协议 / 条款</option>
        <option value="policy">制度 / 规章</option>
      </select>
      <button class="primary" id="run">开始脱水</button>
    </div>
    <div class="note" id="hint">也可以把任意 .txt 拖进来——学生手册、租房合同、用户协议都行。文本不会离开你的浏览器。</div>
  </div>

  <div id="out" class="hidden">
    <div class="stats" id="stats"></div>

    <h2>你真该看的这几句 <em id="candCount"></em> <em>离线排序 · 只给事实，不含模型撰写的一句话</em></h2>
    <div id="cands"></div>

    <h2>原文 <em>命中处已标出，红=高危，橙=中，蓝=泡泡词</em></h2>
    <div class="doc" id="doc"></div>

    <h2>他没写的 <em id="gapReg"></em></h2>
    <div class="gaps" id="gaps"></div>
    <div class="note">「该说而没说」也是套路。这类东西关键词抓不到，只能检查缺了什么。</div>

    <div class="row" style="margin-top:22px">
      <button class="ghost" id="copy">复制报告</button>
      <button class="ghost" id="clear">清空</button>
    </div>
  </div>

  <footer>Dehydrator AI · L1 确定性层 · 词典 __LEXVER__ 条 / 规则 __RULEVER__ 条 · 全部在本地运行</footer>
</div>

<script>
/* ---- 词表 ---- */
var LEX = __LEXICON__;
var RULES = __RULES__;
var PRESETS = __PRESETS__;
__ENGINE__
var DH = window.DH;
var CAT = LEX.categories;
var last = null;

var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
var pct = function (a, b) { return b ? Math.round((a / b) * 100) : 0; };

document.querySelectorAll('.chip[data-preset]').forEach(function (el) {
  el.onclick = function () {
    $('input').value = PRESETS[Number(el.dataset.preset)].text;
  };
});

$('file').onchange = function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () { $('input').value = fr.result; $('hint').textContent = '已载入：' + f.name + '（' + f.size + ' 字节）'; };
  fr.readAsText(f, 'utf-8');
};

$('clear').onclick = function () { $('input').value = ''; $('out').classList.add('hidden'); last = null; };

$('run').onclick = function () {
  var raw = $('input').value.trim();
  if (!raw) { $('hint').textContent = '先粘一段文本进来。'; return; }
  if (raw.length < 40) { $('hint').textContent = '太短了，至少 40 个字才看得出结构。'; return; }
  var r = DH.scanText(LEX, RULES, raw);
  var reg = $('reg').value;
  if (reg !== 'auto') r.gaps = DH.missingFields(r.text, reg);
  last = r;
  render(r);
};

function render(r) {
  $('out').classList.remove('hidden');
  var real = DH.splitSentences(r.text).filter(function (s) {
    return r.text.slice(s.start, s.end).trim().length >= 15;
  });
  var byCat = {};
  r.clusters.forEach(function (c) { byCat[c.primary.category] = (byCat[c.primary.category] || 0) + 1; });

  $('stats').innerHTML = [
    ['#', r.text.length.toLocaleString(), '字数'],
    ['#', r.sentences.toLocaleString(), '句'],
    ['#', r.candidates.length, '候选句'],
    ['#', pct(r.candidates.length, real.length) + '%', '压缩到'],
    ['#', r.clusters.length, '命中簇'],
    ['#', r.gaps.name, '判定语域'],
  ].map(function (x) {
    return '<div class="stat"><b>' + x[1] + '</b><s>' + x[2] + '</s></div>';
  }).join('');

  // 候选句：按最高权重排序
  var cands = r.candidates.slice().sort(function (a, b) {
    var wa = Math.max.apply(null, a.hits.map(function (h) { return h.weight; }));
    var wb = Math.max.apply(null, b.hits.map(function (h) { return h.weight; }));
    return wb - wa || b.hits.length - a.hits.length;
  });
  $('candCount').textContent = '共 ' + cands.length + ' 句 / 全文 ' + real.length + ' 句';
  $('cands').innerHTML = cands.slice(0, 60).map(function (c) {
    var top = c.hits.reduce(function (a, b) { return b.weight > a.weight ? b : a; }, c.hits[0]);
    var w = top.weight;
    var role = CAT[top.category].role;
    var cls = role === 'dilution' ? 'dil' : 'w' + w;
    var tags = c.hits.map(function (h) {
      return '<span class="tag">' + CAT[h.category].name + '·' + h.label + '</span>';
    });
    // 只报事实，不下结论：谁有权 / 后果由谁承担
    var b = DH.bearingOfSentence(c.text);
    if (b.bearing) {
      var fact = b.kind === 'power'
        ? DH.PARTY_NAMES[b.holder] + ' 有权'
        : '后果由 ' + DH.PARTY_NAMES[b.bearing] + ' 承担';
      tags.push('<span class="tag" style="color:#9db8ff;background:#141c2b">' + fact + '</span>');
    }
    var sent = esc(c.text).replace(new RegExp(esc(top.matched).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')), '<span class="hit">$&</span>');
    return '<div class="cand ' + cls + '"><div class="meta">' + tags.join('') +
      (top.needsStance ? '<span class="tag" style="color:#ffd8a8">需判立场</span>' : '') +
      '</div><div class="sentence">' + sent + '</div></div>';
  }).join('') || '<div class="note">这段没有命中任何套路。</div>';

  $('doc').innerHTML = DH.segments(r.text, r.clusters).map(function (g) {
    if (g.type === 'text') return esc(g.text);
    var role = CAT[g.category].role;
    var cls = role === 'dilution' ? '' : (g.weight === 3 ? ' class="w3"' : '');
    return '<mark' + cls + ' title="' + g.label + '">' + esc(g.text) + '</mark>';
  }).join('');

  $('gapReg').textContent = '（按「' + r.gaps.name + '」检查）';
  if (r.gaps.skipped) {
    $('gaps').innerHTML = '<span class="gap" style="border-color:#2f3742;background:#14181d;color:#8b95a5">跳过：' + r.gaps.reason + '</span>';
  } else {
    $('gaps').innerHTML =
      r.gaps.missing.map(function (k) { return '<span class="gap">✕ 没写：' + k + '</span>'; }).join('') +
      r.gaps.present.map(function (k) { return '<span class="have">✓ 有：' + k + '</span>'; }).join('');
  }
}

$('copy').onclick = function () {
  if (!last) return;
  var lines = ['【文字脱水机 · 离线报告】', '字数 ' + last.text.length + ' / 句 ' + last.sentences + ' / 候选 ' + last.candidates.length + ' 句', ''];
  last.candidates.slice(0, 20).forEach(function (c, i) {
    var top = c.hits.reduce(function (a, b) { return b.weight > a.weight ? b : a; }, c.hits[0]);
    lines.push((i + 1) + '. [' + CAT[top.category].name + '] ' + c.text);
  });
  lines.push('', '没写：' + last.gaps.missing.join('、'));
  navigator.clipboard.writeText(lines.join('\n')).then(function () { $('copy').textContent = '已复制 ✓'; });
};
</script>
</body>
</html>
